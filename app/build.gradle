plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.example.pdftextreplacer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.pdftextreplacer"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        python {
            version "3.11"
            pip {
                install "pymupdf"
                install "Pillow"
                install "pytesseract"
            }
        }
    }
}

dependencies {
    implementation 'com.chaquo.python:gradle:15.0.1'
}
